{
  "openapi": "3.1.0",
  "info": {
    "title": "asystant-ai Gateway API",
    "version": "0.1.0",
    "description": "Self-hosted reference API for Flutter assistants with local tools. Maximum request body: 256 KiB. Provider keys stay server-side. Use HTTPS and trusted ingress controls for public deployment.",
    "license": {
      "name": "MIT",
      "identifier": "MIT"
    }
  },
  "servers": [
    {
      "url": "http://localhost:8787",
      "description": "Local development only; replace with your HTTPS deployment."
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/v1/sessions/exchange": {
      "post": {
        "operationId": "exchangeTicket",
        "summary": "Exchange a signed ticket for a temporary credential",
        "description": "Ticket claims: iss, aud, sub, tenant, sid, jti, iat, exp, session_exp. Only a trusted product backend may issue them. Tickets cannot choose an unregistered issuer or bypass persistent login revocation.",
        "responses": {
          "200": {
            "description": "Success.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Credential"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input, manifest, transcript or model policy.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Missing, invalid, expired or revoked credential/ticket.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "402": {
            "description": "Daily tenant or user budget exhausted.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Previously consumed ticket or duplicate inference ID.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Admission or concurrency limit reached; Retry-After: 60.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "Retry-After": {
                "schema": {
                  "type": "string"
                },
                "description": "Seconds to wait before a new attempt. Never automatically replay an uncertain write."
              }
            }
          },
          "502": {
            "description": "Provider unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Service or database unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ExchangeInput"
              }
            }
          }
        },
        "security": []
      }
    },
    "/v1/sessions/revoke": {
      "post": {
        "operationId": "revokeLogin",
        "summary": "Revoke all credentials and future tickets for this login",
        "description": "A new host login must use a new sid.",
        "responses": {
          "400": {
            "description": "Invalid input, manifest, transcript or model policy.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Missing, invalid, expired or revoked credential/ticket.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "402": {
            "description": "Daily tenant or user budget exhausted.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Previously consumed ticket or duplicate inference ID.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Admission or concurrency limit reached; Retry-After: 60.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "headers": {
              "Retry-After": {
                "schema": {
                  "type": "string"
                },
                "description": "Seconds to wait before a new attempt. Never automatically replay an uncertain write."
              }
            }
          },
          "502": {
            "description": "Provider unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Service or database unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "204": {
            "description": "Login revoked."
          }
        }
      }
    },
    "/v1/models": {
      "get": {
