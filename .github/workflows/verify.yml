name: Verify gateway
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.95.0
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Validate OpenAPI
        run: |
          python3 -m venv /tmp/asystant-openapi
          /tmp/asystant-openapi/bin/pip install openapi-spec-validator==0.7.2
          /tmp/asystant-openapi/bin/python -c "import json; from openapi_spec_validator import validate; validate(json.load(open('openapi.yaml')))"
      - name: Verify persistent container
        run: |
          docker build -t asystant-api:local .
          python3 scripts/check_container.py
